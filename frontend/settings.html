<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf 설정</title>
<style>
/* 메인과 동일: 카드 면만 `--shelf-panel-fill-opacity` — 창 transparent 시 뒤가 비침 */
:root{ --shelf-panel-fill-opacity:1; }
:root,[data-theme="dark"]{
  --panel-bg:#16161F;
  --panel-border:rgba(255,255,255,0.08);
  --panel-text:#F0F0F0;
  --panel-text-sub:rgba(255,255,255,0.45);
  --accent:#AAED3A;
  --input-bg:rgba(255,255,255,0.07);
  --input-border:rgba(255,255,255,0.12);
  --panel-item-hover:rgba(255,255,255,0.06);
}
[data-theme="soft"]{
  --panel-bg:#FFFFFF;
  --panel-border:#EBEBEB;
  --panel-text:#111111;
  --panel-text-sub:#888888;
  --accent:#6C63FF;
  --input-bg:#F5F5F5;
  --input-border:#E0E0E0;
  --panel-item-hover:#F5F5FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:13px;color:var(--panel-text);-webkit-app-region:no-drag}
body{padding:14px 16px 16px}
.settings-card{
  border-radius:16px;
  border:.5px solid var(--panel-border);
  box-shadow:0 2px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06);
  padding:18px 20px;
  max-width:100%;
}
[data-theme="dark"] .settings-card{
  background:rgb(22 22 31 / var(--shelf-panel-fill-opacity,1));
}
[data-theme="soft"] .settings-card{
  background:rgb(255 255 255 / var(--shelf-panel-fill-opacity,1));
}
.settings-header-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:-18px -20px 14px -20px;
  padding:12px 14px 10px;
  border-radius:16px 16px 0 0;
}
.traffic-close{
  width:12px;height:12px;border-radius:50%;
  border:none;
  background:#FF5F57;
  cursor:pointer;
  flex-shrink:0;
  padding:0;
  -webkit-app-region:no-drag;
  box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.15);
}
.traffic-close:hover{ filter:brightness(1.08); }
.settings-drag{
  flex:1;
  min-width:0;
  cursor:grab;
  user-select:none;
  touch-action:none;
  padding:4px 2px;
  display:flex;
  align-items:center;
}
.settings-drag:active{cursor:grabbing}
.settings-title{font-size:15px;font-weight:700;padding:0 2px}
.lbl{font-size:10px;font-weight:600;color:var(--panel-text-sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.theme-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
/* 테마 카드 = 미리보기 스와치 — 글로벌 data-theme와 무관하게 대비·테두리 유지 */
.theme-btn{
  display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid transparent;
  cursor:pointer;font:inherit;
  -webkit-app-region:no-drag;
}
.theme-btn .t{font-size:12px;font-weight:700}
.theme-btn .s{font-size:10px;margin-top:3px;line-height:1.35}
.theme-btn[data-theme="dark"]{
  background:rgba(28,28,38,.94);
  border-color:rgba(255,255,255,.24);
  color:#ECECEC;
}
.theme-btn[data-theme="dark"] .s{color:rgba(255,255,255,.55)}
.theme-btn[data-theme="soft"]{
  background:#ECECF2;
  border-color:#B8B4CE;
  color:#111;
}
.theme-btn[data-theme="soft"] .s{color:#5C5C66}
.theme-btn[data-theme="dark"]:hover{border-color:#AAED3A;background:rgba(36,36,48,.96)}
.theme-btn[data-theme="soft"]:hover{border-color:#6C63FF;background:#E4E2F5}
.theme-btn.sel[data-theme="dark"]{border-color:#AAED3A;box-shadow:0 0 0 1px #AAED3A}
.theme-btn.sel[data-theme="soft"]{border-color:#6C63FF;box-shadow:0 0 0 1px #6C63FF}
.fill-block{margin-top:10px}
.fill-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;-webkit-app-region:no-drag}
.fill-label input{accent-color:var(--accent)}
.fill-row{margin-top:10px;display:flex;align-items:center;gap:10px;-webkit-app-region:no-drag}
.fill-row span{font-size:11px;color:var(--panel-text-sub);flex-shrink:0;width:42px}
.fill-row input[type=range]{flex:1;min-width:0}
.fill-row input[type=range]:disabled{opacity:.45}
.fill-hint{margin-top:6px;font-size:10px;color:var(--panel-text-sub);line-height:1.35}
.footer{display:flex;gap:8px;margin-top:16px;-webkit-app-region:no-drag}
.btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);font-size:12px;font-weight:500;cursor:pointer;color:var(--panel-text);-webkit-app-region:no-drag}
.btn:hover{background:var(--panel-item-hover)}
.btn-primary{border:none;background:var(--accent);color:#111;font-weight:600}
.btn-primary:hover{filter:brightness(1.05)}
</style>
</head>
<body>
  <div class="settings-card">
    <div class="settings-header-row">
      <button type="button" class="traffic-close" id="btn-close-settings-window" title="닫기" aria-label="창 닫기"></button>
      <div class="settings-drag" data-tauri-drag-region><span class="settings-title">설정</span></div>
    </div>
    <div class="lbl">테마</div>
    <div class="theme-cards">
      <button type="button" class="theme-btn" data-theme="dark" id="btn-theme-dark">
        <div class="t">Dark Glass</div>
        <div class="s">어두운 글래스 패널 · 라임 포인트</div>
      </button>
      <button type="button" class="theme-btn" data-theme="soft" id="btn-theme-soft">
        <div class="t">Soft Color</div>
        <div class="s">밝은 패널 · 바이올렛 포인트</div>
      </button>
    </div>
    <div class="lbl" style="margin-top:12px">패널 투명도</div>
    <div class="fill-block">
      <label class="fill-label" for="cb-translucent">
        <input type="checkbox" id="cb-translucent">
        반투명 패널
      </label>
      <div class="fill-row">
        <span>강도</span>
        <input type="range" id="rng-opacity" min="0.55" max="1" step="0.01" value="1" aria-label="패널 불투명 강도">
      </div>
      <p class="fill-hint" id="hint-opacity">테마·투명도는 메인 앱에도 바로 미리보기됩니다. 창을 닫거나 취소하면 열기 직전 설정으로 돌아갑니다.</p>
    </div>
    <div class="footer">
      <button type="button" class="btn" id="btn-cancel">취소</button>
      <button type="button" class="btn btn-primary" id="btn-apply">적용</button>
    </div>
  </div>
<script>
(function(){
  const THEME_DARK='dark';
  const THEME_SOFT='soft';
  const KEY_THEME='theme';
  const KEY_TR='ui.panelTranslucent';
  const KEY_OP='ui.panelFillOpacity';
  const OP_MIN=0.55;
  const OP_MAX=1;

  function invoke(cmd, args){
    const core=window.__TAURI__?.core;
    if(!core?.invoke) return Promise.reject(new Error('Tauri 없음'));
    return core.invoke(cmd, args);
  }
  function emitToMain(channel, payload){
    return invoke('shelf_emit_to_main_window',{ channel, payload });
  }
  function finish(payload){
    return invoke('shelf_finish_settings_window',{ payload });
  }

  function shelfSettingsWinTrace(tag, detail){
    let extra='';
    if(detail!==undefined&&detail!==null){
      extra=typeof detail==='object'?JSON.stringify(detail):String(detail);
    }
    console.info('[ShelfSettingsWin]', tag, extra);
  }

  function applyDataTheme(token){
    if(token===THEME_SOFT) document.documentElement.setAttribute('data-theme',THEME_SOFT);
    else document.documentElement.setAttribute('data-theme',THEME_DARK);
  }
  function syncThemeButtons(choice){
    document.querySelectorAll('.theme-btn').forEach(b=>{
      b.classList.toggle('sel', b.getAttribute('data-theme')===choice);
    });
  }
  function coerceOpacity(raw){
    if(raw==null||raw==='') return OP_MAX;
    const n=Number.parseFloat(String(raw).trim());
    if(!Number.isFinite(n)) return OP_MAX;
    return Math.min(OP_MAX, Math.max(OP_MIN, n));
  }
  /** 메인 `shelfApplyPanelFillOpacityToDom` 과 동일 — 이 웹뷰의 `.settings-card` 면에도 적용 */
  function applyLocalPanelFillOpacity(translucent, opacity01){
    const eff=translucent
      ? Math.min(OP_MAX, Math.max(OP_MIN, opacity01))
      : 1;
    document.documentElement.style.setProperty('--shelf-panel-fill-opacity', String(eff));
  }
  function syncHint(){
    const cb=document.getElementById('cb-translucent');
    const rng=document.getElementById('rng-opacity');
    const hint=document.getElementById('hint-opacity');
    if(!cb||!rng||!hint) return;
    rng.disabled=!cb.checked;
    const pct=Math.round(Number(rng.value)*100);
    hint.textContent=cb.checked
      ? `메인·이 창 미리보기 · 불투명 ${pct}% (취소·닫기 시 원래대로)`
      : '반투명 끔 미리보기 — 취소·닫기 시 열 때 설정으로 복구.';
  }

  let choiceTheme=THEME_DARK;

  document.getElementById('btn-theme-dark').addEventListener('click',()=>{
    choiceTheme=THEME_DARK;
    applyDataTheme(choiceTheme);
    syncThemeButtons(choiceTheme);
    void emitToMain('shelf-settings-preview-theme',{ token: choiceTheme });
  });
  document.getElementById('btn-theme-soft').addEventListener('click',()=>{
    choiceTheme=THEME_SOFT;
    applyDataTheme(choiceTheme);
    syncThemeButtons(choiceTheme);
    void emitToMain('shelf-settings-preview-theme',{ token: choiceTheme });
  });

  const cbTr=document.getElementById('cb-translucent');
  const rngOp=document.getElementById('rng-opacity');
  /** 이 창 + 메인 동시 미리보기 — 취소·창 닫기 시 메인은 열 때 baseline 으로 복구 */
  function pushPanelPreviewWithMain(){
    const tr=!!cbTr.checked;
    const op=coerceOpacity(rngOp.value);
    applyLocalPanelFillOpacity(tr, op);
    syncHint();
    void emitToMain('shelf-settings-preview-panel',{ translucent: tr, opacity: op });
  }
  cbTr.addEventListener('change', pushPanelPreviewWithMain);
  rngOp.addEventListener('input', pushPanelPreviewWithMain);

  function dismissSettingsWindowWithoutApply(){
    shelfSettingsWinTrace('close.traffic.click',{});
    finish({ confirmed: false })
      .then(()=>shelfSettingsWinTrace('close.traffic.finish.ok',{}))
      .catch(e=>{
        shelfSettingsWinTrace('close.traffic.finish.error', String(e));
        alert('닫기 처리에 실패했습니다: '+e);
      });
  }

  document.getElementById('btn-close-settings-window').addEventListener('click', dismissSettingsWindowWithoutApply);

  document.getElementById('btn-cancel').addEventListener('click',()=>{
    shelfSettingsWinTrace('cancel.click',{});
    finish({ confirmed: false })
      .then(()=>shelfSettingsWinTrace('cancel.finish.ok',{}))
      .catch(e=>{
        shelfSettingsWinTrace('cancel.finish.error', String(e));
        alert('취소 처리에 실패했습니다: '+e);
      });
  });
  document.getElementById('btn-apply').addEventListener('click',async()=>{
    shelfSettingsWinTrace('apply.click',{});
    const tr=!!cbTr.checked;
    const op=coerceOpacity(rngOp.value);
    try{
      await invoke('set_setting',{ key: KEY_THEME, value: choiceTheme });
      await invoke('set_setting',{ key: KEY_TR, value: tr ? '1' : '0' });
      await invoke('set_setting',{ key: KEY_OP, value: String(op) });
      await finish({
        confirmed: true,
        theme: choiceTheme,
        translucent: tr,
        opacity: op,
      });
      shelfSettingsWinTrace('apply.finish.ok',{ theme: choiceTheme });
    }catch(e){
      shelfSettingsWinTrace('apply.error', String(e));
      console.error(e);
      alert('적용 실패: '+(e&&e.message?e.message:String(e)));
    }
  });

  (async function init(){
    try{
      const savedTheme=await invoke('get_setting',{ key: KEY_THEME });
      choiceTheme=savedTheme===THEME_SOFT ? THEME_SOFT : THEME_DARK;
      applyDataTheme(choiceTheme);
      syncThemeButtons(choiceTheme);
      const trRaw=await invoke('get_setting',{ key: KEY_TR });
      const translucent=trRaw==='1'||trRaw===1||trRaw===true||trRaw==='true';
      cbTr.checked=translucent;
      const opRaw=await invoke('get_setting',{ key: KEY_OP });
      rngOp.value=String(coerceOpacity(opRaw));
      rngOp.disabled=!translucent;
      syncHint();
      pushPanelPreviewWithMain();
    }catch(e){
      console.error(e);
      syncHint();
    }
  })();
})();
</script>
</body>
</html>
